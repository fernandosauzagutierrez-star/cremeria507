<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Cremeria507 CECyTEM</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f0eb 0%, #e0d5c1 100%);
            margin: 0;
            padding: 40px 20px;
            color: #333;
            min-height: 100vh;
        }
        .contenedor {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .encabezado-titulo {
            text-align: center;
            margin-bottom: 30px;
        }
        .encabezado-titulo h1 {
            color: #4a2e18;
            font-size: 26px;
            margin: 0 0 5px 0;
        }
        .encabezado-titulo p {
            color: #7d5a44;
            font-size: 14px;
            margin: 0;
        }
        .tarjeta-seccion {
            background: #faf7f2;
            border: 1px solid #eee4d8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        h2 {
            color: #5d4037;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #4a2e18;
        }
        input, textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #dcd0c0;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #7d5a44;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background-color 0.3s;
        }
        button:active {
            transform: scale(0.99);
        }
        .btn-guardar {
            background-color: #6f4e37;
            color: white;
        }
        .btn-guardar:hover {
            background-color: #4a2e18;
        }
        .btn-eliminar {
            background-color: #d9534f;
            color: white;
        }
        .btn-eliminar:hover {
            background-color: #c9302c;
        }
        footer {
            text-align: center;
            font-size: 12px;
            color: #8d6e63;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="encabezado-titulo">
        <h1>Cafetería Artesanal</h1>
        <p>Panel de Altas y Bajas de Clientes (CECyTEM)</p>
    </div>

    <!-- FORMULARIO 1: GUARDAR (ALTAS) -->
    <div class="tarjeta-seccion">
        <h2>➕ Registro de Cliente (Altas)</h2>
        <form id="formulario" action="guardar.php" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Fernando Sauza" required>
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="form-group">
                <label for="mensajeTexto">Mensaje o Pedido:</label>
                <textarea id="mensajeTexto" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>
            <button type="submit" class="btn-guardar">Guardar Registro</button>
        </form>
    </div>

    <!-- FORMULARIO 2: ELIMINAR (BAJAS) -->
    <div class="tarjeta-seccion">
        <h2>🗑️ Eliminar Cliente (Bajas)</h2>
        <form action="eliminar.php" method="POST">
            <div class="form-group">
                <label for="correoEliminar">Correo del cliente a eliminar:</label>
                <input type="email" id="correoEliminar" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <button type="submit" class="btn-eliminar" onclick="return confirm('¿Estás seguro de que deseas eliminar este registro?');">
                Eliminar Definitivamente
            </button>
        </form>
    </div>

    <footer>
        Prácticas 2 y 3 - Conexión PHP y MySQL
    </footer>
</div>

<!-- VALIDACIÓN JAVASCRIPT -->
<script>
document.getElementById("formulario").addEventListener("submit", function(event) {
    let nombre = document.getElementById("nombre").value.trim();
    let correo = document.getElementById("correo").value.trim();
    let mensaje = document.getElementById("mensajeTexto").value.trim();

    if (nombre === "" || correo === "" || mensaje === "") {
        event.preventDefault();
        alert("Por favor, llena todos los campos antes de enviar.");
        return;
    }
});
</script>

</body>
</html>
